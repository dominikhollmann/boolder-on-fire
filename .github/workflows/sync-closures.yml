name: Sync fire closures

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch current closure zones
        run: node scripts/sync-closures.mjs

      - name: Commit if data changed
        run: |
          if git diff --quiet -- data/fire-closures.geojson; then
            echo "No change in closure zones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fire-closures.geojson
          git commit -m "chore: sync fire closure zones"
          git push
